<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Primary SEO -->
    <title>Scratchpad — Offline-First Infinite Digital Notebook</title>
    <meta name="title" content="Scratchpad — Offline-First Infinite Digital Notebook" />
    <meta name="description" content="A fast, minimal, offline-first infinite canvas notebook for stylus, trackpad, and mouse. Features pressure-sensitive ink, auto-shape snapping, paper templates, and PNG/SVG/PDF export." />
    <meta name="keywords" content="digital notebook, infinite canvas, scratchpad, stylus drawing, offline notes, whiteboard, sketching app, SVG export, PDF notebook" />
    <meta name="author" content="Scratchpad" />
    <meta name="robots" content="index, follow" />

    <!-- Theme & Apple / Safari / PWA Icons -->
    <meta name="theme-color" content="#0F1115" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Scratchpad" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#2563EB" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Scratchpad" />
    <meta property="og:title" content="Scratchpad — Offline-First Infinite Digital Notebook" />
    <meta property="og:description" content="A fast, minimal, offline-first infinite canvas notebook for stylus, trackpad, and mouse. Pressure-sensitive ink, auto-shape snapping, and PNG/SVG/PDF export." />
    <meta property="og:image" content="/og-image.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Scratchpad — Offline-First Infinite Digital Notebook" />
    <meta name="twitter:description" content="A fast, minimal, offline-first infinite canvas notebook for stylus, trackpad, and mouse." />
    <meta name="twitter:image" content="/og-image.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Scratchpad",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web, macOS, iPadOS, Windows, Linux",
        "description": "Offline-first infinite canvas digital notebook with pressure-sensitive ink, shape snapping, multi-notebook organization, and PNG/SVG/PDF export.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- jsPDF for multi-page PDF notebook export (gracefully degrades offline) -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
